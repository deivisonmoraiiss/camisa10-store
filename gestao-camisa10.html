<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Camisa 10 Store</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#070707;--bg-soft:#0f0f10;--panel:#121212;--panel-2:#171717;--line:rgba(255,255,255,.08);
      --line-gold:rgba(212,175,55,.18);--gold:#d4af37;--gold-2:#f0cf63;--text:#f6f6f6;--muted:#b7b7b7;
      --danger:#db5c58;--success:#2e8b57;--info:#1f6feb;--shadow:0 10px 28px rgba(0,0,0,.16);
      --radius-xl:26px;--radius-lg:20px;--radius-md:14px;
    }
    body{
      font-family:Inter,Arial,Helvetica,sans-serif;
      background:radial-gradient(circle at top, rgba(212,175,55,.06), transparent 26%), linear-gradient(180deg,#040404 0%, #0b0b0b 100%);
      color:var(--text);min-height:100vh;
    }
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}
    .topbar{
      position:sticky;top:0;z-index:60;
      background:rgba(7,7,7,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    }
    .topbar-inner{width:min(1440px,94%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:78px}
    .brand-block{display:flex;flex-direction:column;gap:4px}
    .brand-title{font-size:1.5rem;font-weight:900;color:var(--gold);letter-spacing:.02em}
    .brand-subtitle{font-size:.92rem;color:var(--muted)}
    .topbar-actions{display:flex;gap:10px;flex-wrap:wrap}
    .container{width:min(1440px,94%);margin:28px auto 42px}
    .card{
      background:#0e0e0e;
      border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:18px;box-shadow:none
    }
    .login-wrapper{max-width:430px;margin:72px auto}
    .login-wrapper .card{padding:28px}
    .login-title{text-align:center;color:var(--gold);font-size:1.7rem;font-weight:800;margin-bottom:10px}
    .subtitle{text-align:center;color:var(--muted);font-size:.95rem;line-height:1.6;margin-bottom:18px}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
    .field label{font-size:.92rem;font-weight:700;color:#f2f2f2}
    .field input,.field textarea,.field select{
      width:100%;padding:13px 14px;border-radius:13px;border:1px solid #262626;background:#0c0c0c;color:#fff;outline:none;font-size:.95rem
    }
    .field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(212,175,55,.55);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
    .field textarea{min-height:110px;resize:vertical}
    .btn{border:none;border-radius:14px;padding:13px 18px;cursor:pointer;font-weight:800;transition:.2s ease;font-size:.92rem}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111}
    .btn-secondary{background:#232323;color:#fff;border:1px solid #343434}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-success{background:var(--success);color:#fff}
    .actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .admin-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .admin-title{font-size:1.9rem;font-weight:900;color:#fff;margin-bottom:8px}
    .admin-copy{color:var(--muted);max-width:780px;line-height:1.7}
    .quick-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 22px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .stat-card{background:#111;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:16px}
    .stat-card strong{display:block;color:var(--gold);font-size:1.45rem;margin-bottom:6px}
    .stat-card span{color:var(--muted);font-size:.9rem}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}

    .module-shell{display:grid;gap:18px}
    .module-switcher{
      display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;
      position:static;top:auto;z-index:auto;
      background:transparent;padding:0;border:none;border-radius:0;backdrop-filter:none
    }
    .module-btn{flex:0 0 auto;min-width:130px;border:none;background:#111;color:#f2f2f2;border:1px solid rgba(255,255,255,.05);padding:10px 14px;border-radius:14px;font-weight:900;cursor:pointer;transition:.2s ease;text-align:left}
    .module-btn small{display:block;color:var(--muted);font-weight:600;font-size:.78rem;margin-top:4px}
    .module-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;border-color:transparent;box-shadow:0 14px 28px rgba(0,0,0,.18)}
    .module-btn.active small{color:#2f2510}
    .module-panel{display:none}
    .module-panel.active{display:block}
    .module-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px}
    .module-heading-copy{color:var(--muted);line-height:1.6;max-width:760px}
    .module-mini-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
    .module-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:#101010;border:1px solid rgba(255,255,255,.05);color:#dcdcdc;font-size:.8rem;font-weight:800}
    .gestao-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .gestao-card{padding:18px;border-radius:16px;background:#101010;border:1px solid rgba(255,255,255,.05);display:grid;gap:10px}
    .gestao-card strong{font-size:1.04rem;color:#fff}
    .gestao-card p{color:var(--muted);font-size:.9rem;line-height:1.55}
    .gestao-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.22);color:var(--gold-2);font-weight:900}
    .mobile-shortcut-row{display:none}
    .focus-shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 18px}
    .focus-shortcut{padding:16px 18px;border-radius:16px;background:#101010;border:1px solid rgba(255,255,255,.05);display:grid;gap:6px}
    .focus-shortcut strong{font-size:1rem;color:#fff}
    .focus-shortcut span{color:var(--muted);font-size:.84rem;line-height:1.45}
    .focus-shortcut .btn{margin-top:6px}
    .order-summary-box.highlight strong{color:var(--gold-2)}

    .tab-btn{border:none;background:#131313;color:#f1f1f1;border:1px solid rgba(255,255,255,.05);padding:10px 15px;border-radius:999px;font-weight:800;cursor:pointer;transition:.2s ease}
    .tab-btn.active{background:var(--gold);color:#111;border-color:var(--gold)}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .grid-2{display:grid;grid-template-columns:minmax(380px, 560px) minmax(0,1fr);gap:20px;align-items:start}
    .grid-2-equal{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
    .section-title{color:var(--gold);font-size:1.2rem;font-weight:900;margin-bottom:16px}
    .section-copy{color:var(--muted);line-height:1.65;font-size:.92rem;margin-bottom:16px}
    .sizes-box{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:10px;margin-top:8px}
    .size-item{background:#1a1a1a;border:1px solid #2b2b2b;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;cursor:pointer}
    .size-item input{width:auto;accent-color:var(--gold)}
    .products-toolbar,.categories-toolbar,.slides-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .products-toolbar input,.categories-toolbar input,.slides-toolbar input{flex:1;min-width:220px;padding:12px 14px;border-radius:14px;border:1px solid #2d2d2d;background:#101010;color:#fff}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#101010}
    table{width:100%;border-collapse:collapse;min-width:860px;background:#101010}
    thead{background:#181818}
    th,td{padding:14px 12px;border-bottom:1px solid #202020;text-align:left;vertical-align:middle;font-size:.9rem}
    th{color:var(--gold);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
    td{color:#f3f3f3}
    .product-thumb{width:58px;height:58px;object-fit:cover;border-radius:12px;border:1px solid #2a2a2a;background:#0f0f0f}
    .preview-box{margin-top:10px;padding:14px;border:1px solid #2a2a2a;background:#101010;border-radius:16px}
    .main-preview{width:100%;max-width:220px;border-radius:14px;display:block;border:1px solid #2b2b2b;object-fit:cover}
    .multi-preview-grid,.gallery-list{display:flex;flex-wrap:wrap;gap:10px}
    .multi-preview-grid img,.gallery-item img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid #2b2b2b;background:#0f0f0f}
    .gallery-item{position:relative;width:110px}
    .gallery-item button{width:100%;margin-top:6px;padding:8px 10px;font-size:12px;border-radius:10px}
    .small-muted{color:var(--muted);font-size:.84rem}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(212,175,55,.12);color:#f0d98a;border:1px solid rgba(212,175,55,.2);font-size:12px;font-weight:800;margin:2px 4px 2px 0}
    .badge-featured{background:var(--gold);color:#111;border:none;font-size:11px;padding:4px 8px;border-radius:7px;margin-left:6px;font-weight:900}
    .table-actions{display:flex;gap:8px;flex-wrap:wrap}
    .message{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:.9rem;display:none}
    .message.show{display:block}.message.success{background:rgba(46,139,87,.15);border:1px solid rgba(46,139,87,.3);color:#b9f0cf}.message.error{background:rgba(217,83,79,.15);border:1px solid rgba(217,83,79,.3);color:#ffd2d0}
    .empty-state{padding:20px;color:var(--muted);text-align:center}
    .helper-box{margin-top:10px;padding:13px 14px;border-radius:14px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.16);color:#f5deb3;font-size:.84rem;line-height:1.55}
    .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .mini-card{background:#0d0d0d;border:none;border-radius:14px;padding:16px}
    .mini-card h4{color:#fff;font-size:1rem;margin-bottom:12px}
    .banner-preview{width:100%;height:180px;object-fit:cover;border-radius:14px;border:1px solid #2b2b2b;background:#0f0f0f;margin-top:10px}
    .stack{display:grid;gap:18px}
    .ghost{display:none!important}

    .topbar-inner{min-height:72px}
    .brand-title{font-size:1.35rem}
    .brand-subtitle{font-size:.86rem}
    .container{margin:18px auto 30px}
    .card{padding:16px}
    .tabs{position:sticky;top:84px;z-index:40;background:rgba(7,7,7,.92);padding:10px;border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px)}
    .tab-btn{padding:10px 14px}
    .mini-card{padding:16px}
    .helper-box{display:none}
    .preview-box{padding:12px}
    .table-wrap{border-radius:16px}

    .form-header-row,.list-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
    .inline-status{display:flex;gap:10px;flex-wrap:wrap}
    .mini-kpi{display:inline-flex;flex-direction:column;gap:4px;padding:11px 13px;border-radius:14px;background:#0f0f0f;border:1px solid rgba(255,255,255,.05)}
    .mini-kpi strong{color:var(--gold);font-size:1rem}
    .mini-kpi span{color:var(--muted);font-size:.82rem}
    .stepper-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 18px}
    .step-chip{border:1px solid var(--line);background:#151515;color:#f2f2f2;padding:12px 14px;border-radius:14px;font-weight:800;cursor:pointer;transition:.2s ease;text-align:center}
    .step-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;border-color:transparent}
    .step-chip.done{border-color:rgba(212,175,55,.34);color:#f3d77d}
    .product-step{display:none}
    .product-step.active{display:block}
    .step-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .helper-box-visible{display:block}
    .sizes-box-premium .size-item{min-height:62px;transition:.2s ease}
    .sizes-box-premium .size-item.active{background:linear-gradient(135deg, rgba(212,175,55,.20), rgba(212,175,55,.10));border-color:rgba(212,175,55,.55);box-shadow:0 10px 24px rgba(0,0,0,.18);color:#fff6cf}
    .sizes-box-premium .size-item input{display:none}
    .sizes-box-premium .size-item span{font-size:1rem}

    .product-meta-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
    .type-suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .type-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#151515;border:1px solid var(--line);font-size:.82rem;color:#f3f3f3;cursor:pointer;transition:.2s ease}
    .type-chip:hover{border-color:rgba(212,175,55,.4);color:#fff}
    .size-profile-note{margin-top:8px;color:var(--muted);font-size:.82rem;line-height:1.5}
    .draft-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
    .draft-summary-card{padding:16px;border-radius:16px;background:#101010;border:1px solid var(--line);display:grid;gap:6px}
    .draft-summary-card span{color:var(--muted);font-size:.82rem}
    .draft-summary-card strong{color:#fff;font-size:1rem}
    .products-toolbar-advanced{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(160px,.9fr) minmax(160px,.9fr) minmax(170px,.95fr) auto;align-items:center}
    .products-toolbar-advanced select{padding:12px 14px;border-radius:14px;border:1px solid #2d2d2d;background:#101010;color:#fff}
    .product-admin-list{display:grid;grid-template-columns:1fr;gap:12px}
    .product-admin-card{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px;border-radius:16px;background:#101010;border:1px solid rgba(255,255,255,.05);overflow:visible;align-items:start;cursor:pointer}
    .product-admin-card.is-open{border-color:rgba(212,175,55,.34);box-shadow:0 0 0 1px rgba(212,175,55,.14)}
    .product-admin-image-wrap{position:relative;width:88px;height:88px;aspect-ratio:auto;background:#0f0f0f;border:none;border-radius:14px;overflow:hidden}
    .product-admin-select{position:absolute;top:6px;right:6px;z-index:2;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:rgba(7,7,7,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
    .product-admin-select input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
    .product-admin-thumb{width:100%;height:100%;object-fit:cover;background:#0f0f0f;transition:none}
    .product-admin-card:hover .product-admin-thumb{transform:none}
    .product-admin-content{display:grid;gap:10px;min-width:0;padding:0}
    .product-admin-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .product-admin-title{font-size:1rem;font-weight:900;color:#fff;line-height:1.35}
    .product-admin-sub{color:var(--muted);font-size:.84rem;word-break:break-word}
    .product-admin-price{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .price-main{font-size:1.05rem;font-weight:900;color:var(--gold-2)}
    .price-old{text-decoration:line-through;color:#8f8f8f;font-size:.88rem}
    .product-admin-meta{display:flex;gap:6px;flex-wrap:wrap}
    .product-admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
    .product-admin-actions .btn{padding:9px 12px;font-size:.84rem}
    .product-admin-actions .btn-primary-soft{
      background:rgba(212,175,55,.10);
      color:#f6df95;
      border:1px solid rgba(212,175,55,.24)
    }
    .product-admin-actions .btn-primary-soft:hover{background:rgba(212,175,55,.16)}
    .product-admin-details{display:grid;gap:10px;min-width:0}
